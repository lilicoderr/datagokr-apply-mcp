<html><body>
<h3>일반 인증키 발급 현황</h3>
<table><tr><th>일반 인증키(Encoding)</th>
<td><input type="text" readonly value="FAKEFAKEFAKEfakeKEY%2BEXAMPLE%2FNOTAREALKEY%3D%3D"></td></tr>
<tr><th>일반 인증키(Decoding)</th>
<td><input type="text" readonly value="FAKEFAKEFAKEfakeKEY+EXAMPLE/NOTAREALKEY=="></td></tr></table>
<div>활용신청 현황 3</div>
</body></html>
