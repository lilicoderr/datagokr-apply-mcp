name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: node --check bin/server.js && node --check src/tools.js
      - name: Typecheck (tsc --noEmit, checkJs)
        run: npm ci && npm run typecheck
      - name: Run tests
        run: node --test
      - name: Self-check (install guide verification)
        run: npm run selfcheck
      - name: Doctor smoke test
        run: node bin/server.js doctor || true

  # 위 matrix 는 Chromium 을 받지 않아 브라우저 테스트를 건너뛴다. 여기서만 설치해 실제로 실행한다(상대는 로컬 가짜 포털).
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - name: Install Chromium matching the locked playwright-core
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Browser end-to-end tests (skipping is a failure)
        shell: bash
        env:
          DATAGO_REQUIRE_BROWSER: '1'
        run: |
          node --test --test-reporter=tap test/apply-e2e.test.js test/use-e2e.test.js | tee browser.tap
          grep -qx '# skipped 0' browser.tap || { echo '::error::browser tests were skipped'; exit 1; }

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test with coverage
        run: |
          node --test --experimental-test-coverage 2>&1 | tee coverage.txt
          { echo '### Test coverage'; echo '```'; sed -n '/start of coverage report/,/end of coverage report/p' coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
