name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: node --check bin/server.js && node --check src/tools.js
      - name: Run tests
        run: node --test
      - name: Doctor smoke test
        run: node bin/server.js doctor || true

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test with coverage
        run: |
          node --test --experimental-test-coverage 2>&1 | tee coverage.txt
          { echo '### Test coverage'; echo '```'; sed -n '/start of coverage report/,/end of coverage report/p' coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
